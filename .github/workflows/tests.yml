name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      # The runners have no KiCad: tests/test_integration_kicad.py skips itself. Pointing KICAD_CLI at a path that
      # does not exist also keeps auto-detection from ever looking for one.
      KICAD_CLI: ${{ github.workspace }}/no-kicad/kicad-cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install ".[test]"
      - name: Unit tests
        run: python -m pytest -p no:cacheprovider -rs
